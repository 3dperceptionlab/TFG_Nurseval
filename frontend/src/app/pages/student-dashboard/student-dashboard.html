<div class="mb-8 relative">
      <span class="absolute z-30 top-3 right-0 w-fit px-5 py-2 bg-light-blue text-dark-blue rounded-lg font-bold uppercase flex items-center gap-2 transition-all whitespace-nowrap">
        <fa-icon [icon]="icons.faCheck"></fa-icon>
        Evaluado
      </span>
      <div class="mb-8">
        <h1 class="text-4xl font-extrabold text-slate-800 mb-2">Evaluación del procedimiento</h1>
        <p class="text-slate-500 mt-1">Descubre cómo te desenvuelves durante la práctica realizada con las Hololens y consulta la evaluación de tu profesor.</p>
      </div>
      <div class="mt-5 flex items-center gap-2 text-slate-800 mb-6">
        <span class="py-1 text-2xl font-bold border-l-4 border-aqua-blue pl-4">
          {{ evaluation().evaluacion.procedimiento }}:
        </span>
        <span class="text-slate-500 py-1 text-2xl">{{ evaluation().evaluacion.fecha }}</span>
      </div>
    </div>

    <app-evaluation [evaluation]="evaluation()"></app-evaluation>

    <app-video-section></app-video-section>

    <app-comments [evaluation]="evaluation()"></app-comments>

    <app-general-feedback></app-general-feedback>
