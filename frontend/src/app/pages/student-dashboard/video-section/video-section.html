<div class="flex flex-row gap-8">
      <div class="bg-white w-4/5 rounded-lg border border-slate-200 shadow-sm overflow-hidden mb-8">
        <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
            <div class="flex items-center gap-2 text-slate-600">
              <fa-icon [icon]="icons.faVrCardboard" />
              <h3 class="font-bold ">Vídeo POV - HoloLens 2</h3>
            </div>
            <span class="text-[10px] bg-aqua-blue/10 text-aqua-blue px-2 py-1 rounded font-bold uppercase tracking-wider border border-aqua-blue/20">
            Referencia Primera Persona
            </span>
        </div>
        <div class="aspect-video bg-slate-800 relative group overflow-hidden">
            <div class="absolute inset-0 border-20 border-white/5 pointer-events-none"></div>
            <div class="absolute inset-0 flex items-center justify-center">
                <button class="w-20 h-20 bg-aqua-blue text-white rounded-full shadow-2xl flex items-center justify-center transform transition-all duration-300 hover:scale-110 group-hover:bg-dark-blue">
                    <fa-icon [icon]="icons.faPlay" [size]="'xl'" />
                </button>
            </div>
            <div class="absolute bottom-0 w-full p-6 bg-linear-to-t from-black/80 to-transparent translate-y-2 group-hover:translate-y-0 transition-transform duration-300">
                <div class="flex flex-col gap-3">
                    <div class="h-1.5 w-full bg-white/20 rounded-full overflow-hidden cursor-pointer group/progress">
                    <div class="h-full bg-aqua-blue w-1/3 relative">
                        <div class="absolute right-0 top-1/2 -translate-y-1/2 w-3 h-3 bg-white rounded-full shadow-sm scale-0 group-hover/progress:scale-100 transition-transform"></div>
                    </div>
                    </div>
                    <div class="flex items-center justify-between text-white">
                    <div class="flex items-center gap-4">
                        <fa-icon [icon]="icons.faPlay" />
                        <span class="text-xs font-mono tracking-tighter">00:01:48 / 00:05:24</span>
                    </div>
                    <fa-icon [icon]="icons.faExpand" />
                    </div>
                </div>
            </div>
        </div>
      </div>
      <div class="h-fit w-100 space-y-5 bg-white rounded-lg p-8 shadow-md">
        <div class="flex flex-col gap-1 pb-5 border-b-2 border-slate-200">
          <span class="text-slate-700 text-lg font-bold uppercase"><fa-icon [icon]="icons.faStopwatch"></fa-icon> Instante</span>
          <span class="text-aqua-blue text-2xl ml-5"> 00:02:45</span>
        </div>
        <div class="flex flex-col gap-2">
          <span class="text-slate-700 text-lg font-bold uppercase"><fa-icon [icon]="icons.faFaceMeh"></fa-icon> Cabeza</span>
          <div class="flex flex-col text-slate-600 gap-2 ml-2 pl-4 divide-y divide-slate-200">
            <div class="flex justify-between "> <span>Pos X:</span> <span class="text-aqua-blue"> 30.610</span></div>
            <div class="flex justify-between"> <span>Pos Y:</span> <span class="text-aqua-blue"> -20.479</span></div>
            <div class="flex justify-between"> <span>Pos Z:</span> <span class="text-aqua-blue"> -37.345</span></div>
          </div>
        </div>
        <div class="flex flex-col gap-2">
          <span class="text-slate-700 text-lg font-bold uppercase"><fa-icon [icon]="icons.faHand"></fa-icon> Manos</span>
          <div class="flex flex-col text-slate-600 gap-2 ml-2 pl-4  divide-y divide-slate-200">
            <div class="flex justify-between "> <span>Pos X:</span> <span class="text-aqua-blue"> 30.610</span></div>
            <div class="flex justify-between"> <span>Pos Y:</span> <span class="text-aqua-blue"> -20.479</span></div>
            <div class="flex justify-between"> <span>Pos Z:</span> <span class="text-aqua-blue"> -37.345</span></div>
          </div>
        </div>
        <div class="flex flex-col gap-2">
          <span class="text-slate-700 text-lg font-bold uppercase"><fa-icon [icon]="icons.faEye"></fa-icon> Ojos</span>
          <div class="flex flex-col text-slate-600 gap-2 ml-2 pl-4 divide-y divide-slate-200">
            <div class="flex justify-between "> <span>Pos X:</span> <span class="text-aqua-blue"> 30.610</span></div>
            <div class="flex justify-between"> <span>Pos Y:</span> <span class="text-aqua-blue"> -20.479</span></div>
            <div class="flex justify-between"> <span>Pos Z:</span> <span class="text-aqua-blue"> -37.345</span></div>
          </div>
        </div>
      </div>
    </div>
