<div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8">
  <div class="mb-8">
    <h1 class="text-4xl font-extrabold text-slate-800 mb-2">Alumnos</h1>
    <p class="text-slate-500 mt-1">Listado de alumnos asociados.</p>
  </div>
  
  <button (click)="showModal.set(!showModal())" type="button" class="px-8 py-3 bg-aqua-blue text-white rounded-lg font-bold flex items-center gap-2 hover:bg-dark-blue transition-all shadow-sm">
      <fa-icon [icon]="icons.faPlus"></fa-icon>
      <span>Añadir alumno</span>
  </button>
</div>

<app-filters></app-filters>

<app-students-table [students]="alumnos()"></app-students-table>

<app-page-selector [actualPage]="1" [elementsPerPage]="6" [totalElements]="35"></app-page-selector>

@if(showModal()){
  <app-add-student-modal (closeModal)="this.showModal.set(!this.showModal())" ></app-add-student-modal>
}
