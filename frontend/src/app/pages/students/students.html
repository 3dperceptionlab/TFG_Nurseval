<div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8">
  <div class="mb-8">
    <h1 class="text-4xl font-extrabold text-slate-800 mb-2">Alumnos</h1>
    <p class="text-slate-500 mt-1">Listado de alumnos asociados.</p>
  </div>
  
  <button (click)="showModal.set(!showModal())" type="button" class="px-8 py-3 bg-aqua-blue text-white rounded-lg font-bold flex items-center gap-2 hover:bg-dark-blue transition-all shadow-sm">
      <fa-icon [icon]="icons.faPlus"></fa-icon>
      <span>Añadir alumno</span>
  </button>
</div>

<app-filters (filtersChange)="onFiltersChange($event)"></app-filters>


<div class="relative min-h-100">
  
  <div [class.opacity-40]="isLoading()" [class.pointer-events-none]="isLoading()" class="transition-opacity duration-300">
    <app-students-table (studentUnlinked)="onFiltersChange({ query: '', course: '', group: '' }); " [students]="students()"></app-students-table>
    <app-page-selector [actualPage]="1" [elementsPerPage]="6" [totalElements]="students.length"></app-page-selector>
  </div>

  <!-- Spinner -->
  @if (isLoading()) {
    <div class="absolute inset-0 flex items-center justify-center bg-white/50 backdrop-blur-xs transition-opacity duration-300 z-10">
      <div role="status" class="relative w-12 h-12 animate-spin">
        <div class="absolute top-0 left-0 bg-aqua-blue w-4 h-4 rounded-full"></div>
        <div class="absolute top-1/2 right-0 bg-dark-blue w-4 h-4 rounded-full"></div>
      </div>
    </div>
  }
</div>
@if(showModal()){
  <app-add-student-modal (studentsInvited)="onStudentsInvited()" (closeModal)="this.showModal.set(!this.showModal())" ></app-add-student-modal>
}
