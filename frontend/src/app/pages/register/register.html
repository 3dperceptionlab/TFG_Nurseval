<div class="bg-background text-slate-800 h-dvh w-full flex flex-col overflow-hidden">
  
  <app-header class="flex-none"></app-header>
  <main class="flex-1 overflow-y-auto flex items-center justify-center p-4 sm:p-10 bg-linear-to-b from-background to-light-blue">
    
    <div class="max-w-3xl w-full">
      <div class="p-8 sm:p-16 rounded-4xl bg-white border border-slate-200 shadow-xs">
        <h1 class="text-3xl text-center text-slate-800 font-bold mb-4">Regístrate</h1>

        <form (submit)="onSubmit($event)" class="mt-10 space-y-3 flex flex-col items-center justify-center">
          
          <div class="inline-flex w-full max-w-md p-1 bg-white border border-slate-200 rounded-lg shadow-sm">
            <button 
              type="button"
              (click)="setRole('student')"
              [class]="registerForm.role().value() === 'student' ? 'bg-light-blue text-dark-blue font-medium' : 'text-slate-500 hover:text-slate-600'"
              class="flex items-center justify-center gap-2 w-1/2 py-2.5 text-sm rounded-lg transition-all duration-300 ease-in-out">
              <svg class="w-5 h-5 stroke-current" fill="none" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 14l9-5-9-5-9 5 9 5z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z" />
              </svg>
              <span>Estudiante</span>
            </button>
            <button 
              type="button"
              (click)="setRole('professor')"
              [class]="registerForm.role().value() === 'professor' ? 'bg-light-blue text-dark-blue font-medium' : 'text-slate-500 hover:text-slate-600'"
              class="flex items-center justify-center gap-2 w-1/2 py-2.5 text-sm rounded-lg transition-all duration-300 ease-in-out">
              <svg class="w-5 h-5 stroke-current" fill="none" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
              </svg>
              <span>Profesor</span>
            </button>
          </div>

          <div class="grid gap-6 lg:grid-cols-2 space-y-6 w-full">
            <div class="space-y-3">
              <div>
                <label for="name" class="mb-2 text-slate-900 inline-block">Nombre</label>
                <input type="text" id="name" placeholder="María" [formField]="registerForm.name"
                    class="px-3 py-2.5 text-sm text-slate-900 rounded-md bg-white w-full outline-1 -outline-offset-1 outline-slate-300 focus:outline-2 focus:-outline-offset-2 focus:outline-aqua-blue" />
              </div>
              <div>
                <label for="email" class="mb-2 text-slate-900 inline-block">Email</label>
                <input type="email" id="email" placeholder="maria@example.com" [formField]="registerForm.email"
                    class="px-3 py-2.5 text-sm text-slate-900 rounded-md bg-white w-full outline-1 -outline-offset-1 outline-slate-200 focus:outline-2 focus:-outline-offset-2 focus:outline-aqua-blue" />
              </div>
              <div>
                <label for="password" class="mb-2 text-slate-900 inline-block">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" [formField]="registerForm.password"
                    class="px-3 py-2.5 text-sm text-slate-900 rounded-md bg-white w-full outline-1 -outline-offset-1 outline-slate-200 focus:outline-2 focus:-outline-offset-2 focus:outline-aqua-blue" />
              </div>
            </div>

            <div class="space-y-3">
              <div>
                <label for="surname" class="mb-2 text-slate-900 inline-block">Apellidos</label>
                <input type="text" id="surname" placeholder="González Serna" [formField]="registerForm.surname"
                    class="px-3 py-2.5 text-sm text-slate-900 rounded-md bg-white w-full outline-1 -outline-offset-1 outline-slate-200 focus:outline-2 focus:-outline-offset-2 focus:outline-aqua-blue" />
              </div>
              
              @if (!registerForm.student_course().hidden() && !registerForm.student_group().hidden()){
                <div class="flex flex-row gap-4">
                  <div class="w-1/2">
                    <label for="student_course" class="mb-2 text-slate-900 inline-block">Curso</label>
                    <input type="text" id="student_course" placeholder="Cuarto" [formField]="registerForm.student_course" class="px-3 py-2.5 text-sm text-slate-900 rounded-md bg-white w-full outline-1 -outline-offset-1 outline-slate-200 focus:outline-2 focus:-outline-offset-2 focus:outline-aqua-blue" />
                  </div>
                  <div class="w-1/2">
                    <label for="student_group" class="mb-2 text-slate-900 inline-block">Grupo</label>
                    <input type="number" id="student_group" placeholder="1" [formField]="registerForm.student_group" class="px-3 py-2.5 text-sm text-slate-900 rounded-md bg-white w-full outline-1 -outline-offset-1 outline-slate-200 focus:outline-2 focus:-outline-offset-2 focus:outline-aqua-blue" />
                  </div>
                </div>
              }

              @if (!registerForm.position().hidden()){
                <div>
                  <label for="position" class="mb-2 text-slate-900 inline-block">Cargo</label>
                  <input type="text" id="position" placeholder="Director" [formField]="registerForm.position" class="px-3 py-2.5 text-sm text-slate-900 rounded-md bg-white w-full outline-1 -outline-offset-1 outline-slate-200 focus:outline-2 focus:-outline-offset-2 focus:outline-aqua-blue" />
                </div>
              }

              <div>
                <label for="repassword" class="mb-2 text-slate-900 inline-block">Repetir contraseña</label>
                <input type="password" id="repassword" placeholder="••••••••" [formField]="registerForm.repassword"
                    class="px-3 py-2.5 text-sm text-slate-900 rounded-md bg-white w-full outline-1 -outline-offset-1 outline-slate-200 focus:outline-2 focus:-outline-offset-2 focus:outline-aqua-blue" />
              </div>
            </div>
          </div>

          <button type="submit" class="w-fit px-20 py-3 bg-aqua-blue text-white rounded-lg font-bold hover:bg-dark-blue transition-all shadow-sm shadow-blue-shadow">
              Registrar cuenta
          </button>

          <div class="text-slate-900 text-sm text-center">¿Ya tienes una cuenta? 
            <a routerLink="/login" class="text-aqua-blue hover:underline ml-1 font-medium focus:outline-none focus-visible:ring-2 focus-visible:ring-dark-blue">Inicia sesión</a>
          </div>
        </form>
      </div>
    </div>
  </main>
</div>
