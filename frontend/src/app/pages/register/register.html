<div class=" bg-background text-slate-800">
  <app-header></app-header>

  <div class="min-h-screen flex flex-col items-center justify-center">
    
    <div class="max-w-3xl w-full">
      <div
        class="p-20 rounded-4xl bg-white border border-slate-200 shadow-xs ">
        <h1 class="text-3xl text-center text-slate-800 font-bold mb-4">Regístrate</h1>

        <form class=" mt-10 space-y-3 flex flex-col items-center justify-center ">
          <div class="grid gap-6 lg:grid-cols-2 space-y-6">
            <div class="space-y-3">
                <div>
                  <label for="email"
                      class="mb-2 text-slate-900 inline-block ">Nombre</label>
                  <input type="text" id="name" name="name" placeholder="María" required
                      class="px-3 py-2.5 text-sm text-slate-900 rounded-md bg-white w-full outline-1 -outline-offset-1 outline-slate-300 focus:outline-2 focus:-outline-offset-2 focus:outline-aqua-blue " />
                </div>
                <div>
                  <label for="email"
                      class="mb-2 text-slate-900 inline-block ">Email</label>
                  <input type="email" id="email" name="email" placeholder="maria@example.com" required
                      class="px-3 py-2.5 text-sm text-slate-900 rounded-md bg-white w-full outline-1 -outline-offset-1 outline-slate-200 focus:outline-2 focus:-outline-offset-2 focus:outline-aqua-blue " />
                </div>
                <div>
                  <label for="password"
                      class="mb-2 text-slate-900 inline-block ">Contraseña</label>
                  <input type="password" id="password" name="password" placeholder="••••••••" required
                      class="px-3 py-2.5 text-sm text-slate-900 rounded-md bg-white w-full outline-1 -outline-offset-1 outline-slate-200 focus:outline-2 focus:-outline-offset-2 focus:outline-aqua-blue " />
                </div>
                <div>
                  <label for="password"
                      class="mb-2 text-slate-900 inline-block ">Repetir ontraseña</label>
                  <input type="password" id="repassword" name="repassword" placeholder="••••••••" required
                      class="px-3 py-2.5 text-sm text-slate-900 rounded-md bg-white w-full outline-1 -outline-offset-1 outline-slate-200 focus:outline-2 focus:-outline-offset-2 focus:outline-aqua-blue " />
                </div>
            </div>
            <div class="space-y-3">
                <div>
                  <label for="email"
                      class="mb-2 text-slate-900 inline-block ">Apellidos</label>
                  <input type="text" id="surname" name="surname" placeholder="González Serna" required
                      class="px-3 py-2.5 text-sm text-slate-900 rounded-md bg-white w-full outline-1 -outline-offset-1 outline-slate-200 focus:outline-2 focus:-outline-offset-2 focus:outline-aqua-blue " />
                </div>
                <div class="inline-flex w-full max-w-md p-1 bg-white border border-slate-200 rounded-xl shadow-sm">
  
                  <!-- Opción Estudiante -->
                  <button 
                    type="button"
                    (click)="selectedRole() === 'student'"
                    [ngClass]="selectedRole() === 'student' ? 'bg-light-blue text-dark-blue font-medium' : 'text-slate-500 hover:text-slate-600'"
                    class="flex items-center justify-center gap-2 w-1/2 py-2.5 text-sm rounded-lg transition-all duration-300 ease-in-out">
                    
                    <!-- Icono de Gorro de Graduación (Estudiante) -->
                    <svg class="w-5 h-5 stroke-current" fill="none" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 14l9-5-9-5-9 5 9 5z" />
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z" />
                    </svg>
                    <span>Estudiante</span>
                  </button>

                  <!-- Opción Profesor -->
                  <button 
                    type="button"
                    (click)="selectedRole() === 'teacher'"
                    [ngClass]="selectedRole() === 'teacher' ? 'bg-light-blue text-dark-blue font-medium' : 'text-slate-500 hover:text-slate-600'"
                    class="flex items-center justify-center gap-2 w-1/2 py-2.5 text-sm rounded-lg transition-all duration-300 ease-in-out">
                    
                    <!-- Icono de Libro (Profesor) -->
                    <svg class="w-5 h-5 stroke-current" fill="none" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                    </svg>
                    <span>Profesor</span>
                  </button>

                </div>
            </div>
          </div>
          <button type="submit" class="w-fit px-20 py-3 bg-aqua-blue text-white rounded-xl font-bold hover:bg-dark-blue transition-all shadow-sm shadow-blue-shadow">
              Registrar cuenta
          </button>

          <div class="text-slate-900 text-sm text-center">¿Ya tienes una cuenta? <a routerLink="/login"
                class="text-aqua-blue hover:underline ml-1 font-medium focus:outline-none focus-visible:ring-2 focus-visible:ring-dark-blue">Inicia sesión</a>
          </div>
        </form>
      </div>
    </div>
</div>
</div>
