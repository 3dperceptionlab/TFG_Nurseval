<div class="mb-8">
  <h1 class="text-4xl font-extrabold text-slate-800 mb-2">Evaluaciones pendientes</h1>
  <p class="text-slate-500 mt-1">Prácticas de tus alumnos pendientes de evaluar.</p>
</div>
<div class="mb-5 flex gap-8 items-center">
    <p class="font-semibold text-slate-500">Filtrar por:</p>
    <div class="flex flex-wrap gap-3">
    @for (key of protocolKeys; track key) {
        <button 
        (click)="selectedKey.set(key)"
        [class]="selectedKey() === key ? 'bg-aqua-blue text-white border-aqua-blue shadow-md scale-105' : 'bg-white text-aqua-blue border-slate-200 hover:border-aqua-blue'"
        class="px-4 py-2 rounded-lg border text-sm font-medium transition-all capitalize cursor-pointer">
            {{ PROTOCOLOS_DATA[key].nombre }}
        </button>
    }
    </div>      
</div>

<app-procedures-list [procedures]="procedimientos"></app-procedures-list>

<app-page-selector [actualPage]="1" [elementsPerPage]="4" [totalElements]="15"></app-page-selector>
