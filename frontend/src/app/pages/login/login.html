<div class="bg-background text-slate-800 h-dvh w-full flex flex-col overflow-hidden ">
  
  <app-header class="flex-none"></app-header>
  
  <main class="flex-1 overflow-y-auto flex items-center justify-center p-4 sm:p-10 bg-linear-to-b from-white to-light-blue">
      
    <div class="max-w-xl w-full">
      <div class="p-8 sm:p-16 rounded-4xl bg-white border border-slate-200 shadow-xs">
        <h1 class="text-3xl text-center text-slate-800 font-bold mb-4">Inicia sesión</h1>

        <form class="space-y-4 mt-10" (submit)="onSubmit($event)">
            <div>
              <label for="email" class="mb-2 text-slate-900 inline-block font-medium">Email</label>
              <input type="email" id="email" placeholder="yourname@example.com" [formField]="loginForm.email"
                  class="px-3 py-2.5 text-sm text-slate-900 rounded-md bg-white w-full outline-1 -outline-offset-1 outline-slate-300 focus:outline-2 focus:-outline-offset-2 focus:outline-aqua-blue" />
            </div>
            
            <div>
              <label for="password" class="mb-2 text-slate-900 inline-block font-medium">Contraseña</label>
              <input type="password" id="password" placeholder="••••••••" [formField]="loginForm.password"
                  class="px-3 py-2.5 text-sm text-slate-900 rounded-md bg-white w-full outline-1 -outline-offset-1 outline-slate-300 focus:outline-2 focus:-outline-offset-2 focus:outline-aqua-blue" />
            </div>
            
            <div class="pt-2">
              <button type="submit" class="w-full px-8 py-3 bg-aqua-blue text-white rounded-xl font-bold hover:bg-dark-blue transition-all shadow-sm shadow-blue-shadow">
                Iniciar sesión
              </button>
            </div>

            <div class="text-slate-900 text-sm text-center pt-2">
              ¿No tienes una cuenta?
              <a routerLink="/register" class="text-aqua-blue hover:underline ml-1 font-medium focus:outline-none focus-visible:ring-2 focus-visible:ring-dark-blue rounded">Regístrate</a>
            </div>
        </form>
      </div>
    </div>

  </main>
</div>
