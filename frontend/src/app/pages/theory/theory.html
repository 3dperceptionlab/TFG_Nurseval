<div class="mb-8">
  <h1 class="text-4xl font-extrabold text-slate-800 mb-2">Teoría</h1>
  <p class="text-slate-500 mt-1">Aprende la técnica de cada protocolo paso a paso.</p>
</div>

<div class=" mx-auto bg-white rounded-2xl p-6 border border-slate-200 shadow-sm mb-8 grid md:grid-cols-3 gap-8 items-start">
  <div class="md:col-span-2">
    <p class="font-semibold text-slate-500 mb-4">Selecciona el tipo de vendaje:</p>
    <div class="flex flex-wrap gap-3">
    @for (key of protocolKeys; track key) {
        <button 
        (click)="selectedKey.set(key)"
        [class]="selectedKey() === key ? 'bg-aqua-blue text-white border-aqua-blue shadow-md scale-105' : 'bg-white text-aqua-blue border-slate-200 hover:border-aqua-blue'"
        class="px-4 py-2 rounded-lg border text-sm font-medium transition-all capitalize cursor-pointer">
          {{ PROTOCOLOS_DATA[key].nombre }}
        </button>
    }
    </div>
  </div>        
</div>
<app-steps (openModal)="this.showVideoModal.set(!this.showVideoModal())" [currentProtocol]="currentProtocol() "></app-steps>

<app-video-modal (closeEmit)="this.showVideoModal.set(!this.showVideoModal())" [currentProtocol]="currentProtocol()" [showVideoModal]="showVideoModal() "></app-video-modal>
