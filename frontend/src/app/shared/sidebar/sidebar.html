<aside class="w-64 flex flex-col h-screen bg-white border-r border-slate-200">
    <div class="p-6 flex items-center gap-2">
    <div class="w-8 h-8 bg-aqua-blue rounded-lg flex items-center justify-center text-white">
        <lucide-icon name="stethoscope" size="20"></lucide-icon>
    </div>
    <div class="flex flex-col">
        <!-- <span class="text-lg font-bold text-slate-900 leading-none">NurseEval</span> -->
         <img src="/images/logo.png" alt="" class="w-1/2">
        <span class="text-xs text-slate-500">Panel Estudiante</span>
    </div>
    </div>

    <nav class="flex-1 px-4 space-y-2 mt-4">
    @for (item of menuItems; track item.label) {
        <a [class]="item.active ? 'bg-[#005c63] text-white shadow-md' : 'text-slate-600 hover:bg-slate-50'"
            class="flex items-center gap-3 px-4 py-3 rounded-xl transition-all cursor-pointer font-medium group">
        <lucide-icon [name]="item.icon" size="20"></lucide-icon>
        {{ item.label }}
        </a>
    }
    </nav>

    <div class="p-4 border-t border-slate-100">
    <div class="flex items-center gap-3 p-2 mb-4">
        <div class="w-10 h-10 rounded-full bg-slate-200 flex items-center justify-center text-slate-500">
            <lucide-icon name="user" size="20"></lucide-icon>
        </div>
        <div class="overflow-hidden">
        <p class="text-sm font-bold text-slate-900 truncate">juan.perez</p>
        <p class="text-xs text-slate-600">Student</p>
        </div>
    </div>
    
    <button class="w-full flex items-center gap-3 px-4 py-2 text-slate-500 hover:text-red-500 transition-colors text-sm font-medium">
        <lucide-icon name="log-out" size="18"></lucide-icon>
        Cerrar sesión
    </button>
    </div>
</aside>
