<aside class="w-80 flex flex-col h-screen bg-white border-r-2 border-slate-200">
    <a routerLink="/" class="flex p-8 ">
      <img src="/images/logo.png" alt="" class="w-4/5 m-auto">
    </a>

    <nav class="flex-1 px-8 space-y-3 mt-6">
    @for (item of menuItems(); track item.label) {
      <a (click)="setItem(item.label)" 
        [routerLink]="item.route"
        [routerLinkActiveOptions]="{exact: true}"
        routerLinkActive="bg-aqua-blue hover:bg-dark-blue text-white"
        #rla="routerLinkActive"
        [class]="rla.isActive  ? '' : 'bg-white text-dark-blue border-slate-200 hover:bg-slate-50'"
        class="w-full px-8 py-3 border rounded-lg font-bold flex justify-center items-center gap-2 transition-all cursor-pointer">
        <fa-icon [icon]="item.icon" />
        <p>{{ item.label }}</p>
      </a>
    }
    </nav>

    <div class="p-8 border-t border-slate-100 flex flex-col gap-4">
      <div class="flex items-center gap-3 mb-4">
        <div class="w-10 h-10 rounded-full bg-slate-200 flex items-center justify-center text-slate-500">
          <fa-icon size="xl" [icon]="icons.faUserCircle" />
        </div>
        @if(this.authService.currentUser()){
        <div class="overflow-hidden">
          <p class="text-sm font-bold text-slate-900 truncate">{{this.authService.currentUser()?.name + ' ' + this.authService.currentUser()?.surname}}</p>
          <p class="text-xs text-aqua-blue">{{this.authService.currentUser()?.role === "student" ? 'Estudiante' : 'Docente'}}</p>
        </div>
        }
      </div>
      
      <button (click)="logout()" class="cursor-pointer w-full flex items-center gap-3 text-slate-500 hover:text-red-500 transition-colors text-sm font-medium">
        <fa-icon [icon]="icons.faSignOut" />
        Cerrar sesión
      </button>
    </div>
</aside>
