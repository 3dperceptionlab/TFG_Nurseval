<div class="flex h-screen w-full overflow-hidden">
  <!-- Sidebar -->
  <div 
    class="h-full transition-all duration-300 ease-in-out shrink-0 z-40 overflow-hidden relative"
    [class.w-80]="!hideSidebar()"
    [class.w-0]="hideSidebar()">
    
    <app-sidebar class="w-full h-full block"></app-sidebar>
  </div>
  <!-- Boton para ocultar -->
  <div class="flex items-center h-full relative z-50">
    <button (click)="toggleSidebar()" 
      class="absolute bottom-20 -left-0.5 w-8 h-16 bg-white border-2 border-l-0 border-slate-200  rounded-r-xl flex items-center justify-center text-slate-500 hover:text-slate-800 transition-colors cursor-pointer">
  
      <fa-icon [icon]="faAngleRight" class="w-4 h-4 transition-transform duration-300" [class.rotate-180]="hideSidebar()"></fa-icon>
    </button>
  </div>

  <!-- Contenido -->
  <main class="flex-1 overflow-y-auto bg-background px-28 py-18 ">
    <router-outlet></router-outlet>
  </main>
</div>
